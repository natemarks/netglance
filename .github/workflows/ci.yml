name: CI

on:
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c  # v2.7.7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run static analysis
        run: make static

  integration-tests:
    name: Integration Tests
    # Only run integration tests on release PRs
    if: startsWith(github.head_ref, 'release/v') || startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c  # v2.7.7

      - name: Run integration tests
        run: make integration-test

  build:
    name: Build Release Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c  # v2.7.7

      - name: Build release binary
        run: make build-release

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [static-analysis, build, integration-tests]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.static-analysis.result }}" != "success" ]] || [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Required checks failed"
            exit 1
          fi
          echo "✅ All required CI checks passed successfully!"

      - name: Integration tests status
        if: needs.integration-tests.result != 'skipped'
        run: |
          if [[ "${{ needs.integration-tests.result }}" == "success" ]]; then
            echo "✅ Integration tests passed"
          else
            echo "❌ Integration tests failed"
            exit 1
          fi
