[package]
name = "netglance"
version = "0.0.1"
edition = "2021"
authors = ["Nate Marks"]
description = "TCP connection monitor TUI with latency tracking"
license = "MIT"
repository = "https://github.com/nmarks/netglance"
keywords = ["network", "monitoring", "tui", "tcp", "latency"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
flate2 = "1.0"
parking_lot = "0.12"

[dev-dependencies]
futures = "0.3"
tempfile = "3.0"
filetime = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
